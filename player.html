<body data-page="spill">
<div class="page">

  <div id="site-header"></div>

  <main>
    <section>
      <div class="player-stage">
        <!-- Topplinjen ligger i normal flyt OVER spillflaten (den var før
             absoluttposisjonert oppå den). Poeng/rekord-boksen havner her
             (fylles av js/game-runtime.js), utenfor det skalerte spillskallet,
             slik at hele spillflaten under kan brukes av selve brettet – og
             slik at HUD-teksten beholder sin egen lesbare størrelse i stedet
             for å blåses opp sammen med brettet. -->
        <div class="player-topbar">
          <a href="index.html#spill" class="back-link player-back-link" aria-label="Tilbake til menyen">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            <!-- Teksten skjules på smale skjermer (se .player-back-link-text
                 i css/style.css), der den ellers dytter poeng/rekord ut av
                 topplinjen. aria-label på lenken holder den lesbar for
                 skjermlesere også da. -->
            <span class="player-back-link-text">Tilbake til menyen</span>
          </a>
          <div class="player-hud-slot" data-player-hud></div>
        </div>
        <div class="player-stage-inner" data-player-stage></div>
      </div>
    </section>
  </main>

<script>
(function () {
  "use strict";
  // Laster kun skriptet(ene) det aktuelle spillet trenger, i stedet for alle
  // spillmoduler (+ fysikkmotoren Matter.js, som kun Fruktfusjon bruker) på
  // hver eneste spillside. main.js venter på window.STUDILLA_GAME_SCRIPT_READY
  // (hvis satt) før den ser etter window.STUDILLA_GAME_MODULES.
  // Faller tilbake til det første spillet i fallback-listen (samme som
  // main.js sin games[0]-fallback) hvis ?id= mangler i URL-en, slik at
  // direkte lenker uten id fortsatt laster et spillskript.
  const fallbackId = (window.STUDILLA_GAMES && window.STUDILLA_GAMES[0] && window.STUDILLA_GAMES[0].id) || "";
  const id = new URLSearchParams(window.location.search).get("id") || fallbackId;
  const safeId = /^[a-z0-9-]{1,40}$/.test(id) ? id : null;
  const EXTRA_SCRIPTS_BY_ID = { fruktfusjon: ["js/vendor/matter.min.js"] };
  // Spillmodulen heter normalt js/games/game-<id>.js. Fruktfusjon er unntaket
  // (filen heter game-fruit-merge.js), så den slås opp her i stedet – ellers
  // ber siden om en fil som ikke finnes og spillet laster aldri.
  const MODULE_BY_ID = { fruktfusjon: "js/games/game-fruit-merge.js" };
  const moduleSrc = safeId ? (MODULE_BY_ID[safeId] || `js/games/game-${safeId}.js`) : null;
  const scripts = safeId ? (EXTRA_SCRIPTS_BY_ID[safeId] || []).concat([moduleSrc]) : [];

  function loadScript(src) {
    return new Promise((resolve) => {
      const el = document.createElement("script");
      el.src = src;
      el.onload = resolve;
      // Feiler stille: main.js viser en enkel plassholder hvis modulen mangler.
      el.onerror = resolve;
      document.head.appendChild(el);
    });
  }

  window.STUDILLA_GAME_SCRIPT_READY = scripts.reduce(
    (chain, src) => chain.then(() => loadScript(src)),
    Promise.resolve()
  );
})();
</script>
<script src="js/main.js"></script>
