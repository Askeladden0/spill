<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Rangering</title>
<meta name="description" content="Se hvem som topper poenglisten hos Studilla.">
<meta property="og:title" content="Studilla · Rangering">
<meta property="og:description" content="Se hvem som topper poenglisten hos Studilla.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="stylesheet" href="css/style.css" data-studilla-head>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/social.css">
</head>
<body data-page="rangering">
<div class="page">

  <div id="site-header"></div>

  <main id="hovedinnhold">
    <section>
      <div class="section-heading spread" style="align-items:flex-end;flex-wrap:wrap;gap:20px">
        <div>
          <h1>Rangering</h1>
        </div>
        <div class="rank-search-wrap">
          <!-- Søket filtrerer selve tabellen i stedet for å åpne en egen
               liste med treff: da ser du plasseringen og poengene til den du
               søker opp, ikke bare navnet. -->
          <input type="search" class="rank-search-input" placeholder="Søk etter en spiller …" data-search-input autocomplete="off">
        </div>
      </div>

      <!-- Tre akser å filtrere på – triks, periode og hvem – som hver sin
           nedtrekksmeny. Som chips ble dette en lang linje så snart det kom
           flere triks. -->
      <div class="rank-filters" data-filters style="margin-bottom:18px"></div>

      <div class="leaderboard-panel">
        <div class="leaderboard-head">
          <span>PLASS</span><span>SPILLER</span><span>KAMPER</span><span>POENG</span>
        </div>
        <div class="leaderboard-body" data-leaderboard-body>
          <div class="leaderboard-empty">Laster brukere …</div>
        </div>
        <div class="leaderboard-foot">
          <span class="section-sub" data-shown-label></span>
          <button type="button" class="btn-outline" data-toggle-rows hidden>Vis alle</button>
        </div>
      </div>
    </section>

    <section>
      <div class="rank-section-heading">
        <h2>Deg</h2>
        <span class="section-sub" data-me-scope></span>
      </div>

      <div data-rank-me-slot style="margin-bottom:20px"></div>

      <div data-mygames-section hidden>
        <div class="rank-section-heading">
          <h3>Din score per triks</h3>
          <span class="section-sub">Beste runde i hvert triks</span>
        </div>
        <div class="trickcard-grid" data-mygames-grid></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout-markup.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/social.js"></script>
<script src="js/visit-tracking.js"></script>
<script src="js/games-data.js"></script>
<script src="js/leaderboard-data.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  "use strict";
  const Auth = window.StudillaAuth;
  const LB = window.StudillaLeaderboard;
  const esc = window.StudillaSocial.escapeHTML;
  const games = LB.games;
  const LEVELS_ENABLED = !!(window.STUDILLA_FEATURES && window.STUDILLA_FEATURES.levelsEnabled);

  const VISIBLE_ROWS = 10;
  const MEDAL_COLORS = ["#f5c451", "#c9d2de", "#d08a52"];

  const PERIODS = [
    { id: "all", label: "Alle tider" },
    { id: "month", label: "Denne måneden" },
    { id: "week", label: "Denne uka" },
    { id: "today", label: "I dag" },
  ];

  const CROWDS = [
    { id: "alle", label: "Alle spillere" },
    { id: "venner", label: "Vennene mine" },
    { id: "skole", label: "Skolen min", soon: true },
  ];

  let profile = null;
  let profiles = [];
  let boards = { total: [], perGame: {} };
  let friendIds = [];

  // Filtrene: hvilket triks, hvilken periode og hvem som er med.
  let game = "total";
  let period = "all";
  let crowd = "alle";

  let query = "";
  let expanded = false;
  let openMenu = null;

  // Periodelistene hentes først når noen faktisk ber om dem, og huskes per
  // kombinasjon av periode og triks. `null` betyr «henter nå».
  const periodBoards = new Map();

  function fmt(n) {
    return Math.round(n || 0).toLocaleString("no-NO");
  }

  function gameLabel() {
    if (game === "total") return "Alle triks samlet";
    const g = games.find((x) => x.id === game);
    return g ? g.name : "Alle triks samlet";
  }

  function periodLabel() {
    const p = PERIODS.find((x) => x.id === period);
    return p ? p.label : "Alle tider";
  }

  function periodKey() {
    return period + "|" + game;
  }

  /**
   * Lista slik den ser ut med dagens filtre. Returnerer null mens en
   * periodeliste fortsatt hentes, slik at tabellen kan si «Laster …» i
   * stedet for å blinke «ingen spillere».
   */
  function currentBoard() {
    let base;
    if (period === "all") {
      base = game === "total" ? boards.total : boards.perGame[game] || [];
    } else {
      base = periodBoards.get(periodKey());
      if (!base) return null;
    }
    if (crowd === "venner") {
      return LB.buildFriendsBoard(base, friendIds, profile && profile.id);
    }
    return base;
  }

  /** Henter periodelista hvis vi ikke har den fra før, og tegner på nytt. */
  async function ensureBoard() {
    if (period === "all") return;
    const key = periodKey();
    if (periodBoards.has(key)) return;
    periodBoards.set(key, null);
    const rows = await LB.loadPeriod(period, game === "total" ? null : game);
    periodBoards.set(key, LB.buildPeriodBoard(profiles, rows || []));
    renderAll();
  }

  function playerLink(p) {
    return `spillerprofil.html?u=${encodeURIComponent(p.username)}`;
  }

  // ---------- Filtermenyer ----------
  function menuDefs() {
    return [
      {
        key: "game",
        eyebrow: "Triks",
        value: `${game === "total" ? "" : window.gameIconHTML(games.find((g) => g.id === game) || {}, 18)}<span>${esc(gameLabel())}</span>`,
        options: [{ id: "total", label: "Alle triks samlet", active: game === "total" }].concat(
          games.map((g) => ({ id: g.id, label: g.name, icon: window.gameIconHTML(g, 18), active: game === g.id }))
        ),
        pick(id) { game = id; },
      },
      {
        key: "period",
        eyebrow: "Periode",
        value: `<span>${periodLabel()}</span>`,
        options: PERIODS.map((p) => ({ id: p.id, label: p.label, active: period === p.id })),
        pick(id) { period = id; },
      },
      {
        key: "crowd",
        eyebrow: "Hvem",
        value: `<span>${(CROWDS.find((c) => c.id === crowd) || CROWDS[0]).label}</span>`,
        options: CROWDS.map((c) => ({ id: c.id, label: c.label, active: crowd === c.id, soon: c.soon })),
        pick(id) { crowd = id; },
      },
    ];
  }

  const CHECK_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2ee87f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  const CHEVRON_SVG = '<svg class="rank-menu-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7c8aa0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';

  function renderFilters() {
    document.querySelector("[data-filters]").innerHTML = menuDefs()
      .map((menu) => `
        <div class="rank-menu" data-menu="${menu.key}">
          <button type="button" class="rank-menu-btn" data-menu-toggle aria-expanded="${openMenu === menu.key}" aria-haspopup="true">
            <span class="rank-menu-eyebrow">${menu.eyebrow}</span>
            <span class="rank-menu-value">${menu.value}</span>
            ${CHEVRON_SVG}
          </button>
          <div class="rank-menu-list" role="menu" ${openMenu === menu.key ? "" : "hidden"}>
            ${menu.options.map((o) => `
              <button type="button" role="menuitem" class="rank-menu-opt ${o.active ? "is-active" : ""}"
                data-option="${o.id}" ${o.soon ? "disabled" : ""}>
                ${o.icon || ""}
                <span class="rank-menu-opt-label">${esc(o.label)}</span>
                ${o.soon ? '<span class="rank-menu-soon">KOMMER</span>' : o.active ? CHECK_SVG : ""}
              </button>
            `).join("")}
          </div>
        </div>
      `)
      .join("");
  }

  document.addEventListener("click", (e) => {
    const toggle = e.target.closest("[data-menu-toggle]");
    if (toggle) {
      const key = toggle.closest("[data-menu]").dataset.menu;
      openMenu = openMenu === key ? null : key;
      renderFilters();
      return;
    }

    const opt = e.target.closest(".rank-menu-opt");
    if (opt && !opt.disabled) {
      const key = opt.closest("[data-menu]").dataset.menu;
      const def = menuDefs().find((m) => m.key === key);
      def.pick(opt.dataset.option);
      openMenu = null;
      expanded = false;
      renderAll();
      ensureBoard();
      return;
    }

    if (openMenu && !e.target.closest("[data-menu]")) {
      openMenu = null;
      renderFilters();
    }
  });

  // ---------- Tabellen ----------
  function emptyMessage() {
    if (crowd === "venner" && !profile) {
      return `<div class="leaderboard-empty">Logg inn for å se rangeringen blant dem du følger.</div>`;
    }
    if (crowd === "venner") {
      return `<div class="leaderboard-empty">Du følger ingen ennå. Søk opp en spiller her eller på <a href="meldinger.html">Venner</a> for å få en liste du faktisk kan vinne.</div>`;
    }
    if (period !== "all") {
      return `<div class="leaderboard-empty">Ingen har spilt «${esc(gameLabel())}» i denne perioden ennå. Bli den første!</div>`;
    }
    return `<div class="leaderboard-empty">Ingen har spilt «${esc(gameLabel())}» ennå. Bli den første!</div>`;
  }

  function rankCell(p) {
    return p.rank <= 3
      ? `<span class="leaderboard-medal" style="background:${MEDAL_COLORS[p.rank - 1]}">${p.rank}</span>`
      : `<span class="leaderboard-rank-num">${p.rank}</span>`;
  }

  function tagCell(p) {
    if (profile && p.id === profile.id) return '<span class="you-badge">DEG</span>';
    if (friendIds.indexOf(p.id) > -1) {
      return '<span class="friend-badge"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span class="friend-badge-text">VENN</span></span>';
    }
    return "";
  }

  function renderTable() {
    const body = document.querySelector("[data-leaderboard-body]");
    const toggleBtn = document.querySelector("[data-toggle-rows]");
    const shownLabel = document.querySelector("[data-shown-label]");
    const fullBoard = currentBoard();

    if (!fullBoard) {
      body.innerHTML = `<div class="leaderboard-empty">Laster rangeringen …</div>`;
      shownLabel.textContent = "";
      toggleBtn.hidden = true;
      return;
    }

    const board = LB.visiblePlayers(fullBoard);
    if (!board.length) {
      body.innerHTML = emptyMessage();
      shownLabel.textContent = "";
      toggleBtn.hidden = true;
      return;
    }

    const q = query.trim().toLowerCase();
    const filtered = q ? board.filter((p) => p.username.toLowerCase().indexOf(q) > -1) : board;

    if (!filtered.length) {
      body.innerHTML = `<div class="leaderboard-empty">Fant ingen spillere som matcher «${esc(query)}».</div>`;
      shownLabel.textContent = "";
      toggleBtn.hidden = true;
      return;
    }

    const visible = expanded ? filtered : filtered.slice(0, VISIBLE_ROWS);
    // Ligger du langt nede på lista skal du likevel se din egen rad, slik at
    // du slipper å trykke «Vis alle» for å finne deg selv.
    const me = profile && fullBoard.find((p) => p.id === profile.id);
    const meInVisible = me && visible.some((p) => p.id === me.id);
    const shown = me && !meInVisible && !q ? visible.concat([me]) : visible;

    body.innerHTML = shown
      .map(
        (p) => `
        <a class="leaderboard-row ${profile && p.id === profile.id ? "is-me" : ""}" href="${playerLink(p)}">
          <span>${rankCell(p)}</span>
          <span class="leaderboard-player">
            ${Auth.avatarHTML(p, 30)}
            <span class="leaderboard-player-name">${esc(p.username)}</span>
            ${tagCell(p)}
          </span>
          <span class="leaderboard-matches">${fmt(p.matches)}</span>
          <span class="leaderboard-score">${fmt(p.score)}</span>
        </a>
      `
      )
      .join("");

    shownLabel.textContent = `Viser ${shown.length} av ${filtered.length} spillere`;
    toggleBtn.hidden = filtered.length <= VISIBLE_ROWS;
    toggleBtn.textContent = expanded ? "Vis færre" : `Vis alle ${filtered.length}`;
  }

  // ---------- «Deg» ----------
  function renderMeCard() {
    const slot = document.querySelector("[data-rank-me-slot]");
    document.querySelector("[data-me-scope]").textContent = `${gameLabel()} · ${periodLabel()}`;

    if (!profile) {
      slot.innerHTML = `
        <div class="rank-me-guest">
          <span class="section-sub">Logg inn for å se din plassering og få poeng registrert på rangeringen.</span>
          <a href="login.html" class="btn-primary btn-link">Logg inn</a>
        </div>
      `;
      return;
    }

    const board = currentBoard();
    if (!board) {
      slot.innerHTML = `<div class="rank-me-guest"><span class="section-sub">Laster plasseringen din …</span></div>`;
      return;
    }

    const me = board.find((p) => p.id === profile.id);
    if (!me) {
      slot.innerHTML = `
        <div class="rank-me-guest">
          <span class="section-sub">Du har ikke spilt «${esc(gameLabel())}» i denne perioden, så du er ikke rangert her.</span>
          <a href="index.html#spill" class="btn-primary btn-link">Finn et triks</a>
        </div>
      `;
      return;
    }

    slot.innerHTML = `
      <div class="rank-me-card">
        <div class="rank-me-badge">
          <span class="rank-me-badge-label">PLASS</span>
          <span class="rank-me-badge-num">${me.rank}</span>
          <span class="rank-me-badge-of">av ${fmt(board.length)}</span>
        </div>
        <div class="rank-me-body">
          <div class="rank-me-identity">
            ${Auth.avatarHTML(me, 34)}
            <div style="display:flex;flex-direction:column">
              <span class="rank-me-name">Deg — ${esc(me.username)}</span>
              <span class="rank-me-scope">${gameLabel()} · ${periodLabel()}${LEVELS_ENABLED ? ` · Nivå ${me.level}` : ""}</span>
            </div>
          </div>
          <div class="rank-me-stats">
            <div class="rank-me-stat">
              <span class="rank-me-stat-num">${fmt(me.score)}</span>
              <span class="rank-me-stat-label">POENG</span>
            </div>
            <div class="rank-me-stat">
              <span class="rank-me-stat-num is-plain">${fmt(me.matches)}</span>
              <span class="rank-me-stat-label">KAMPER</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function renderMyGames() {
    const section = document.querySelector("[data-mygames-section]");
    if (!profile) {
      section.hidden = true;
      return;
    }
    section.hidden = false;

    document.querySelector("[data-mygames-grid]").innerHTML = games
      .map((g) => {
        const board = boards.perGame[g.id] || [];
        const me = board.find((p) => p.id === profile.id);
        const href = `player.html?id=${encodeURIComponent(g.id)}`;
        return `
          <a class="trickcard" href="${href}">
            <span class="trickcard-cover">
              ${g.thumbnail ? `<img class="trickcard-cover-img" src="${g.thumbnail}" alt="" loading="lazy">` : ""}
              <span class="trickcard-fade"></span>
              <span class="trickcard-name">${esc(g.name)}</span>
            </span>
            <span class="trickcard-side">
              <span class="trickcard-stat">
                <span class="trickcard-score">${me ? fmt(me.score) : "–"}</span>
                <span class="trickcard-label">POENG</span>
              </span>
              <span class="trickcard-stat">
                <span class="trickcard-rank">${me ? "#" + me.rank : "Ikke spilt"}</span>
                <span class="trickcard-label">PLASSERING</span>
              </span>
              <span class="trickcard-start">Start</span>
            </span>
          </a>
        `;
      })
      .join("");
  }

  function renderAll() {
    renderFilters();
    renderTable();
    renderMeCard();
    renderMyGames();
  }

  document.querySelector("[data-toggle-rows]").addEventListener("click", () => {
    expanded = !expanded;
    renderTable();
  });

  const searchInput = document.querySelector("[data-search-input]");
  searchInput.addEventListener("input", (e) => {
    query = e.target.value;
    expanded = false;
    renderTable();
  });

  // ---------- Init ----------
  async function init() {
    if (window.STUDILLA_GAMES_READY) await window.STUDILLA_GAMES_READY;
    profile = await Auth.getCurrentProfile();
    const [loadedProfiles, records, following] = await Promise.all([
      LB.loadProfiles(),
      LB.loadRecords(),
      profile ? window.StudillaSocial.followingIds() : Promise.resolve([]),
    ]);
    profiles = loadedProfiles;
    friendIds = following;
    boards = LB.buildBoards(profiles, records);
    renderAll();
  }

  init();

  window.supabaseClient.auth.onAuthStateChange(async () => {
    profile = await Auth.getCurrentProfile();
    friendIds = profile ? await window.StudillaSocial.followingIds() : [];
    renderAll();
  });
})();
</script>
</body>
</html>
