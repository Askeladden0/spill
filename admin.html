<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PixelPlay · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
<div class="page">

  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="logo">
        <span class="logo-mark">P</span>
        <span class="logo-text">PIXEL<span>PLAY</span></span>
      </a>
      <nav class="main-nav">
        <a href="index.html#spill" class="nav-link" data-page="spill">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><rect x="2" y="6" width="20" height="12" rx="5"></rect></svg>
          Spill
        </a>
        <a href="premier.html" class="nav-link" data-page="premier">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
          Premier
        </a>
        <a href="rangering.html" class="nav-link" data-page="rangering">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="4" width="6" height="17"></rect><rect x="15" y="9" width="6" height="12"></rect><rect x="3" y="12" width="6" height="9"></rect></svg>
          Rangering
        </a>
      </nav>
    </div>
    <div class="header-right" data-auth-slot></div>
  </header>

  <main data-admin-main hidden>
    <section>
      <div class="section-heading"><h1>Adminpanel</h1></div>
      <p class="section-sub" style="margin:-8px 0 0">Kun synlig for administratorer.</p>
    </section>

    <section>
      <div class="section-heading"><h2>Standard profilbilde – farger</h2></div>
      <div class="settings-card">
        <div class="swatch-row" data-admin-colors></div>
        <form class="inline-form" data-add-color-form>
          <input type="text" name="color" placeholder="#4287f5" pattern="^#[0-9a-fA-F]{6}$" required>
          <button type="submit" class="btn-start" style="width:auto;padding:12px 24px">Legg til farge</button>
        </form>
      </div>
    </section>

    <section>
      <div class="section-heading"><h2>Standard profilbilde – ikoner</h2></div>
      <div class="settings-card">
        <div class="swatch-row" data-admin-icons></div>
        <form class="inline-form" data-add-icon-form>
          <input type="text" name="icon" placeholder="🐙" maxlength="4" required>
          <button type="submit" class="btn-start" style="width:auto;padding:12px 24px">Legg til ikon</button>
        </form>
      </div>
      <p class="auth-error" data-avatar-options-error hidden></p>
      <p class="auth-success" data-avatar-options-success hidden></p>
    </section>

    <section>
      <div class="section-heading spread">
        <h2>Brukere</h2>
        <span class="section-sub" data-user-count></span>
      </div>
      <div class="settings-card">
        <table class="records-table" data-users-table>
          <thead>
            <tr><th>Brukernavn</th><th>Nivå</th><th>Registrert</th><th>Admin</th></tr>
          </thead>
          <tbody data-users-tbody>
            <tr><td colspan="4">Laster brukere …</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand">
      <span class="footer-logo-mark">P</span>
      <span class="footer-copy">© 2026 PixelPlay</span>
    </div>
    <nav class="footer-nav">
      <a href="#kontakt">Kontakt</a>
      <a href="#personvern">Personvern</a>
      <a href="#vilkar">Vilkår</a>
      <a href="admin.html" data-admin-only style="display:none">Admin</a>
    </nav>
  </footer>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabaseClient;
  const Auth = window.PixelPlayAuth;

  let currentUserId = null;
  let avatarOptions = { colors: [], icons: [] };

  function showAvatarMessage(el, msg) {
    const errorEl = document.querySelector("[data-avatar-options-error]");
    const successEl = document.querySelector("[data-avatar-options-success]");
    errorEl.hidden = el !== "error";
    successEl.hidden = el !== "success";
    if (el === "error") errorEl.textContent = msg;
    if (el === "success") successEl.textContent = msg;
  }

  async function saveAvatarOptions() {
    const { error } = await sb
      .from("avatar_options")
      .update({ colors: avatarOptions.colors, icons: avatarOptions.icons, updated_at: new Date().toISOString() })
      .eq("id", 1);
    if (error) {
      showAvatarMessage("error", Auth.friendlyAuthError(error));
      return false;
    }
    showAvatarMessage("success", "Lagret!");
    return true;
  }

  function renderAvatarAdmin() {
    document.querySelector("[data-admin-colors]").innerHTML = avatarOptions.colors
      .map(
        (c, i) => `
        <span class="swatch swatch-removable" style="background:${c}">
          <button type="button" data-remove-color="${i}" aria-label="Fjern farge">×</button>
        </span>
      `
      )
      .join("");

    document.querySelector("[data-admin-icons]").innerHTML = avatarOptions.icons
      .map(
        (icon, i) => `
        <span class="swatch swatch-icon swatch-removable">
          ${icon}
          <button type="button" data-remove-icon="${i}" aria-label="Fjern ikon">×</button>
        </span>
      `
      )
      .join("");

    document.querySelectorAll("[data-remove-color]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (avatarOptions.colors.length <= 1) return showAvatarMessage("error", "Du må ha minst én farge.");
        avatarOptions.colors.splice(Number(btn.dataset.removeColor), 1);
        if (await saveAvatarOptions()) renderAvatarAdmin();
      });
    });
    document.querySelectorAll("[data-remove-icon]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (avatarOptions.icons.length <= 1) return showAvatarMessage("error", "Du må ha minst ett ikon.");
        avatarOptions.icons.splice(Number(btn.dataset.removeIcon), 1);
        if (await saveAvatarOptions()) renderAvatarAdmin();
      });
    });
  }

  document.querySelector("[data-add-color-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = e.target.elements.color;
    const value = input.value.trim();
    if (!/^#[0-9a-fA-F]{6}$/.test(value)) return showAvatarMessage("error", "Fargen må være et gyldig hex-format, f.eks. #4287f5.");
    avatarOptions.colors.push(value);
    if (await saveAvatarOptions()) {
      renderAvatarAdmin();
      e.target.reset();
    }
  });

  document.querySelector("[data-add-icon-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = e.target.elements.icon;
    const value = input.value.trim();
    if (!value) return;
    avatarOptions.icons.push(value);
    if (await saveAvatarOptions()) {
      renderAvatarAdmin();
      e.target.reset();
    }
  });

  async function loadUsers() {
    const { data, error } = await sb
      .from("profiles")
      .select("id, username, level, is_admin, created_at")
      .order("created_at", { ascending: false });

    const tbody = document.querySelector("[data-users-tbody]");
    if (error) {
      tbody.innerHTML = `<tr><td colspan="4">Kunne ikke laste brukere.</td></tr>`;
      return;
    }

    document.querySelector("[data-user-count]").textContent = `${data.length} bruker${data.length === 1 ? "" : "e"}`;

    tbody.innerHTML = data
      .map(
        (u) => `
        <tr>
          <td>${u.username}</td>
          <td>${u.level}</td>
          <td>${new Date(u.created_at).toLocaleDateString("no-NO")}</td>
          <td>
            <label class="admin-toggle">
              <input type="checkbox" data-admin-toggle="${u.id}" ${u.is_admin ? "checked" : ""} ${u.id === currentUserId ? "disabled" : ""}>
              <span></span>
            </label>
          </td>
        </tr>
      `
      )
      .join("");

    tbody.querySelectorAll("[data-admin-toggle]").forEach((toggle) => {
      toggle.addEventListener("change", async () => {
        const { error: updateError } = await sb
          .from("profiles")
          .update({ is_admin: toggle.checked })
          .eq("id", toggle.dataset.adminToggle);
        if (updateError) {
          alert("Kunne ikke oppdatere admin-status: " + Auth.friendlyAuthError(updateError));
          toggle.checked = !toggle.checked;
        }
      });
    });
  }

  (async function init() {
    const profile = await Auth.requireAdmin();
    if (!profile) return;
    currentUserId = profile.id;
    document.querySelector("[data-admin-main]").hidden = false;

    const { data, error } = await sb.from("avatar_options").select("colors, icons").eq("id", 1).single();
    if (!error) {
      avatarOptions = data;
      renderAvatarAdmin();
    }

    await loadUsers();
  })();
})();
</script>
</body>
</html>
