<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0d1117;font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#2ee87f;text-decoration:none}
  a:hover{color:#5cf5a0}
  ::selection{background:#2ee87f;color:#0d1117}
</style>
</helmet>
<div style="min-height:100vh;background:#0d1117;color:#e8edf5;padding-bottom:80px">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 32px;height:72px;background:#131a25;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:20">
    <div style="display:flex;align-items:center;gap:36px">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:30px;height:30px;border-radius:9px;background:#2ee87f;display:flex;align-items:center;justify-content:center;color:#0d1117;font-weight:800;font-size:16px">P</div>
        <span style="font-size:20px;font-weight:800;letter-spacing:-.02em;color:#fff">PIXEL<span style="color:#2ee87f">PLAY</span></span>
      </div>
      <nav style="display:flex;align-items:center;gap:8px">
        <a href="#spill" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;background:rgba(46,232,127,.12);color:#2ee87f;font-size:14px;font-weight:600" style-hover="background:rgba(46,232,127,.2)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><rect x="2" y="6" width="20" height="12" rx="5"></rect></svg>
          Spill
        </a>
        <a href="#premier" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;color:#96a3b8;font-size:14px;font-weight:600" style-hover="color:#e8edf5;background:rgba(255,255,255,.05)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
          Premier
        </a>
        <a href="#rangering" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;color:#96a3b8;font-size:14px;font-weight:600" style-hover="color:#e8edf5;background:rgba(255,255,255,.05)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="4" width="6" height="17"></rect><rect x="15" y="9" width="6" height="12"></rect><rect x="3" y="12" width="6" height="9"></rect></svg>
          Rangering
        </a>
      </nav>
    </div>

    <div style="display:flex;align-items:center;gap:14px">
      <div style="display:flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;border-radius:12px;background:#0d1117;border:1px solid rgba(255,255,255,.07)">
        <div style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(46,232,127,.14);color:#2ee87f;font-size:12px;font-weight:800">12</div>
        <div style="display:flex;flex-direction:column;gap:5px;width:132px">
          <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:#96a3b8;letter-spacing:.02em">
            <span>NIVÅ 12</span><span style="color:#e8edf5">640/1000</span>
          </div>
          <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden">
            <div style="width:64%;height:100%;border-radius:99px;background:linear-gradient(90deg,#2ee87f,#8bf0b4)"></div>
          </div>
        </div>
      </div>
      <button style="display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.07);background:#0d1117;color:#e8edf5;font-family:inherit;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer" style-hover="border-color:rgba(46,232,127,.5)">
        <div style="width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#2a3546,#1a2231);display:flex;align-items:center;justify-content:center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#96a3b8" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
        </div>
        Logg inn
      </button>
    </div>
  </header>

  <main style="max-width:1240px;margin:0 auto;padding:36px 32px 0;display:flex;flex-direction:column;gap:52px">

    <section>
      <div style="display:flex;align-items:baseline;gap:12px;margin:0 0 18px">
        <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#fff">Dagens spill</h1>
        <span style="font-size:13px;font-weight:500;color:#7c8aa0">Byttes ut om 08:14:22</span>
      </div>

      <div style="position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(46,232,127,.28);background:#131a25;box-shadow:0 0 0 4px rgba(46,232,127,.06)">
        <div style="position:absolute;top:20px;right:20px;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:99px;background:#2ee87f;color:#0d1117;font-size:16px;font-weight:800;letter-spacing:-.01em;box-shadow:0 8px 24px rgba(46,232,127,.35)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"></path></svg>
          1,5X POENG
        </div>

        <div style="position:relative;min-height:440px;background:repeating-linear-gradient(135deg,#1b2434 0 14px,#202b3d 14px 28px);display:flex;align-items:flex-end">
          <span style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#6b7b93;letter-spacing:.06em">[ hero-bilde: dagens spill 1600×880 ]</span>
          <div style="position:absolute;left:0;right:0;bottom:0;height:75%;background:linear-gradient(180deg,rgba(13,17,23,0) 0%,rgba(13,17,23,.72) 52%,rgba(13,17,23,.97) 100%)"></div>
          <div style="position:relative;z-index:2;padding:44px;display:flex;flex-direction:column;align-items:flex-start;gap:22px">
            <h2 style="margin:0;font-size:52px;line-height:1.02;font-weight:800;letter-spacing:-.03em;color:#fff;text-wrap:balance">Skyfall Tactics</h2>
            <button style="padding:16px 32px;border:none;border-radius:12px;background:#2ee87f;color:#0d1117;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:-.01em;cursor:pointer" style-hover="background:#5cf5a0">Spill nå</button>
          </div>
        </div>
      </div>
    </section>

    <section id="spill">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 0 18px">
        <h2 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff">Alle spill</h2>
        <span style="font-size:13px;font-weight:500;color:#7c8aa0">{{ gameCountLabel }}</span>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px">
        <sc-for list="{{ games }}" as="g" hint-placeholder-count="6">
          <article style="display:flex;flex-direction:column;background:#131a25;border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden" style-hover="border-color:rgba(46,232,127,.35)">
            <div style="position:relative;aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#1b2434 0 12px,#202b3d 12px 24px);display:flex;align-items:center;justify-content:center">
              <span style="font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#6b7b93">{{ g.slot }}</span>
              <div style="position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(180deg,rgba(13,17,23,0) 0%,rgba(13,17,23,.7) 55%,rgba(13,17,23,.96) 100%)"></div>
              <h3 style="position:absolute;left:16px;right:16px;bottom:12px;margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;color:#fff">{{ g.name }}</h3>
            </div>
            <div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px">
              <button style="width:100%;padding:12px;border:none;border-radius:10px;background:#2ee87f;color:#0d1117;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer" style-hover="background:#5cf5a0">Start</button>
            </div>
          </article>
        </sc-for>
      </div>
    </section>

  </main>

  <footer style="max-width:1240px;margin:64px auto 0;padding:24px 32px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.07)">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:24px;height:24px;border-radius:7px;background:#2ee87f;display:flex;align-items:center;justify-content:center;color:#0d1117;font-weight:800;font-size:13px">P</div>
      <span style="font-size:13px;font-weight:500;color:#7c8aa0">© 2026 PixelPlay</span>
    </div>
    <nav style="display:flex;align-items:center;gap:28px">
      <a href="#kontakt" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Kontakt</a>
      <a href="#personvern" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Personvern</a>
      <a href="#vilkar" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Vilkår</a>
    </nav>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1400}}">
class Component extends DCLogic {
  renderVals() {
    const games = [
      { name: "Skyfall Tactics", genre: "Strategi", rating: "4,7", points: "3 750 poeng", time: "~25 min", slot: "[ spillbilde ]" },
      { name: "Neon Drift", genre: "Racing", rating: "4,5", points: "1 900 poeng", time: "~10 min", slot: "[ spillbilde ]" },
      { name: "Kokkeliv", genre: "Simulator", rating: "4,2", points: "820 poeng", time: "~15 min", slot: "[ spillbilde ]" },
      { name: "Dypets Vokter", genre: "Eventyr", rating: "4,8", points: "4 100 poeng", time: "~40 min", slot: "[ spillbilde ]" },
      { name: "Bricks & Bolts", genre: "Puslespill", rating: "4,1", points: "560 poeng", time: "~5 min", slot: "[ spillbilde ]" },
      { name: "Frostmark", genre: "RPG", rating: "4,6", points: "2 480 poeng", time: "~30 min", slot: "[ spillbilde ]" },
      { name: "Skyline Tycoon", genre: "Bygging", rating: "4,3", points: "1 350 poeng", time: "~20 min", slot: "[ spillbilde ]" },
      { name: "Rift Runners", genre: "Action", rating: "4,4", points: "2 050 poeng", time: "~18 min", slot: "[ spillbilde ]" },
      { name: "Kortkongen", genre: "Kort", rating: "4,0", points: "430 poeng", time: "~8 min", slot: "[ spillbilde ]" }
    ];
    return { games, gameCountLabel: games.length + " spill tilgjengelig" };
  }
}

</script>
</body>
</html>
