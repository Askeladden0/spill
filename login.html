<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Logg inn</title>
<meta name="description" content="Logg inn eller registrer deg hos Studilla og start med å samle poeng du kan bytte inn i rabattkoder.">
<meta property="og:title" content="Studilla · Logg inn">
<meta property="og:description" content="Logg inn eller registrer deg hos Studilla og start med å samle poeng du kan bytte inn i rabattkoder.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="assets/img/favicon.svg" color="#2ee87f">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="page">

  <div id="site-header"></div>

  <main>
    <section style="display:flex;justify-content:center">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab is-active" data-tab="login">Logg inn</button>
          <button type="button" class="auth-tab" data-tab="register">Registrer deg</button>
        </div>

        <button type="button" class="google-btn" data-google-btn>
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"></path>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"></path>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 34.9 26.9 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.2 44 24 44z"></path>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.6C41.4 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"></path>
          </svg>
          Fortsett med Google
        </button>

        <div class="auth-divider"><span>eller</span></div>

        <p class="auth-error" data-auth-error hidden></p>
        <p class="auth-success" data-auth-success hidden></p>

        <form data-login-form>
          <label class="auth-field">
            <span>E-post</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="auth-field">
            <span>Passord</span>
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <label class="auth-terms">
            <input type="checkbox" name="accept-terms" required>
            <span>Jeg godtar <a href="vilkar.html" target="_blank" rel="noopener">vilkårene</a> for bruk av Studilla.</span>
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Logg inn</button>
          <button type="button" class="auth-fineprint" style="background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px 0" data-forgot-toggle>Glemt passord?</button>
        </form>

        <form data-forgot-form hidden>
          <p class="section-sub" style="margin:0 0 4px">Skriv inn e-posten din, så sender vi deg en lenke for å velge nytt passord.</p>
          <label class="auth-field">
            <span>E-post</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Send tilbakestillingslenke</button>
          <button type="button" class="auth-fineprint" style="background:none;border:none;cursor:pointer;text-decoration:underline;padding:4px 0" data-forgot-cancel>Tilbake til innlogging</button>
        </form>

        <form data-register-form hidden>
          <label class="auth-field">
            <span>Brukernavn</span>
            <input type="text" name="username" required minlength="5" maxlength="20" autocomplete="username" placeholder="Minst 5 tegn, bokstaver/tall/_">
          </label>
          <label class="auth-field">
            <span>E-post</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="auth-field">
            <span>Passord</span>
            <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minst 8 tegn, med bokstav og tall">
          </label>
          <label class="auth-terms">
            <input type="checkbox" name="accept-terms" required>
            <span>Jeg godtar <a href="vilkar.html" target="_blank" rel="noopener">vilkårene</a> for bruk av Studilla.</span>
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Opprett konto</button>
        </form>

        <p class="auth-fineprint">
          Ved å fortsette godtar du at vi lagrer et brukernavn, en tilfeldig
          tildelt profilfarge/ikon, samt nivå og spillrekorder knyttet til kontoen din.
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabaseClient;
  const Auth = window.StudillaAuth;

  const tabs = document.querySelectorAll(".auth-tab");
  const loginForm = document.querySelector("[data-login-form]");
  const registerForm = document.querySelector("[data-register-form]");
  const forgotForm = document.querySelector("[data-forgot-form]");
  const errorEl = document.querySelector("[data-auth-error]");
  const successEl = document.querySelector("[data-auth-success]");
  const googleBtn = document.querySelector("[data-google-btn]");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
    successEl.hidden = true;
  }

  function showSuccess(msg) {
    successEl.textContent = msg;
    successEl.hidden = false;
    errorEl.hidden = true;
  }

  function clearMessages() {
    errorEl.hidden = true;
    successEl.hidden = true;
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.classList.remove("is-active"));
      tab.classList.add("is-active");
      clearMessages();
      forgotForm.hidden = true;
      const isLogin = tab.dataset.tab === "login";
      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;
    });
  });

  document.querySelector("[data-forgot-toggle]").addEventListener("click", () => {
    clearMessages();
    tabs.forEach((t) => t.classList.remove("is-active"));
    loginForm.hidden = true;
    registerForm.hidden = true;
    forgotForm.hidden = false;
  });

  document.querySelector("[data-forgot-cancel]").addEventListener("click", () => {
    clearMessages();
    forgotForm.hidden = true;
    tabs[0].classList.add("is-active");
    loginForm.hidden = false;
  });

  forgotForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();
    const form = new FormData(forgotForm);
    const email = form.get("email").trim();
    const redirectTo = window.location.origin + window.location.pathname.replace("login.html", "tilbakestill-passord.html");
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error) {
      showError(Auth.friendlyAuthError(error));
      return;
    }
    showSuccess("Hvis kontoen finnes, har vi sendt en e-post med en lenke for å velge nytt passord.");
    forgotForm.reset();
  });

  googleBtn.addEventListener("click", async () => {
    clearMessages();
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname.replace("login.html", "index.html") },
    });
    if (error) showError(Auth.friendlyAuthError(error));
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();
    const form = new FormData(loginForm);
    const { error } = await sb.auth.signInWithPassword({
      email: form.get("email"),
      password: form.get("password"),
    });
    if (error) {
      showError(Auth.friendlyAuthError(error));
      return;
    }
    window.location.href = "index.html";
  });

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();
    const form = new FormData(registerForm);
    const username = form.get("username").trim();
    const email = form.get("email").trim();
    const password = form.get("password");

    const usernameError = Auth.validateUsername(username);
    if (usernameError) return showError(usernameError);

    const passwordError = Auth.validatePassword(password);
    if (passwordError) return showError(passwordError);

    try {
      if (await Auth.isUsernameTaken(username)) {
        return showError("Dette brukernavnet er allerede tatt.");
      }
    } catch (err) {
      return showError(Auth.friendlyAuthError(err));
    }

    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: { data: { username } },
    });

    if (error) return showError(Auth.friendlyAuthError(error));

    if (data.session) {
      window.location.href = "index.html";
    } else {
      showSuccess("Konto opprettet! Sjekk e-posten din for å bekrefte kontoen før du logger inn.");
      registerForm.reset();
    }
  });
})();
</script>
</body>
</html>
