<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Registrer deg</title>
<meta name="description" content="Registrer deg eller logg inn hos Studilla og start med å samle poeng på rangeringen.">
<meta property="og:title" content="Studilla · Registrer deg">
<meta property="og:description" content="Registrer deg eller logg inn hos Studilla og start med å samle poeng på rangeringen.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="stylesheet" href="css/style.css" data-studilla-head>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/social.css">
</head>
<body data-page="login">
<div class="page">

  <div id="site-header"></div>

  <main id="hovedinnhold">
    <section style="display:flex;justify-content:center">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab is-active" data-tab="register">Registrer deg</button>
          <button type="button" class="auth-tab" data-tab="login">Logg inn</button>
        </div>

        <p class="auth-error" data-auth-error hidden></p>
        <p class="auth-success" data-auth-success hidden></p>

        <button type="button" class="google-btn" data-google-signin>
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 0 0 0 24c0 3.87.92 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Fortsett med Google
        </button>
        <p class="auth-fineprint" data-google-terms>Ved å fortsette med Google godtar du <a href="vilkar.html" target="_blank" rel="noopener">vilkårene</a>.</p>
        <div class="auth-divider" style="margin:14px 0">eller</div>

        <form data-login-form hidden>
          <label class="auth-field">
            <span>Brukernavn</span>
            <input type="text" name="username" required autocomplete="username">
          </label>
          <label class="auth-field">
            <span>Passord</span>
            <input type="password" name="password" required autocomplete="current-password">
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Logg inn</button>
        </form>

        <div data-welcome-preview style="display:none;align-items:center;gap:12px;padding:12px 14px;margin-bottom:16px;border-radius:12px;border:1px solid var(--border-strong);background:rgba(var(--accent-rgb), .08)">
          <span data-welcome-logo style="width:44px;height:44px;flex:none;border-radius:10px;background:#201c2b;overflow:hidden;display:flex;align-items:center;justify-content:center"></span>
          <span style="font-size:14px;line-height:1.35;color:var(--text-strong)">Registrer deg og spinn velkomsthjulet: vinn <strong data-welcome-text></strong>.</span>
        </div>

        <form data-register-form>
          <label class="auth-field">
            <span>Brukernavn</span>
            <input type="text" name="username" required minlength="5" maxlength="20" autocomplete="username" placeholder="Minst 5 tegn, bokstaver/tall/_">
          </label>
          <label class="auth-field">
            <span>Passord</span>
            <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minst 8 tegn, med bokstav og tall">
          </label>
          <label class="auth-terms">
            <input type="checkbox" name="accept-terms" required>
            <span>Jeg godtar <a href="vilkar.html" target="_blank" rel="noopener">vilkårene</a> for bruk av Studilla.</span>
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Opprett konto</button>
        </form>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout-markup.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/visit-tracking.js"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabaseClient;
  const Auth = window.StudillaAuth;

  const tabs = document.querySelectorAll(".auth-tab");
  const loginForm = document.querySelector("[data-login-form]");
  const registerForm = document.querySelector("[data-register-form]");
  const errorEl = document.querySelector("[data-auth-error]");
  const successEl = document.querySelector("[data-auth-success]");
  const googleTerms = document.querySelector("[data-google-terms]");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
    successEl.hidden = true;
  }

  function showSuccess(msg) {
    successEl.textContent = msg;
    successEl.hidden = false;
    errorEl.hidden = true;
  }

  function clearMessages() {
    errorEl.hidden = true;
    successEl.hidden = true;
  }

  tabs.forEach((tab) => {
    tab.addEventListener("click", () => {
      tabs.forEach((t) => t.classList.remove("is-active"));
      tab.classList.add("is-active");
      clearMessages();
      const isLogin = tab.dataset.tab === "login";
      loginForm.hidden = !isLogin;
      registerForm.hidden = isLogin;
      googleTerms.hidden = isLogin;
      showWelcome();
    });
  });

  // Viser hvilken rabatt man får ved registrering (admin velger den under
  // Rabatter → Velkomstbonus). Bare synlig på «Registrer deg»-fanen.
  const welcomeBox = document.querySelector("[data-welcome-preview]");
  let welcomePreview = null;
  function showWelcome() {
    welcomeBox.style.display = welcomePreview && !registerForm.hidden ? "flex" : "none";
  }
  sb.rpc("welcome_wheel_config").then(({ data, error }) => {
    if (error || !data || !data.length) return;
    // Hjulet har flere rabatter; vis de ulike partnerne som er med.
    const seen = new Set();
    const brands = [];
    data.forEach((s) => {
      if (!seen.has(s.brand)) { seen.add(s.brand); brands.push(s); }
    });
    welcomePreview = brands;
    const names = brands.map((b) => b.brand.split(" ")[0]);
    const list = names.length > 1 ? `${names.slice(0, -1).join(", ")} eller ${names[names.length - 1]}` : names[0];
    welcomeBox.querySelector("[data-welcome-text]").textContent = `en rabatt fra ${list}`;
    const logoBox = welcomeBox.querySelector("[data-welcome-logo]");
    const first = brands.find((b) => b.image_url);
    if (first) {
      const img = document.createElement("img");
      img.src = first.image_url;
      img.alt = "";
      img.style.cssText = "width:100%;height:100%;object-fit:cover";
      logoBox.appendChild(img);
    }
    showWelcome();
  });

  // Innlogging skjer med brukernavn og passord. Supabase Auth krever teknisk
  // sett en e-postadresse, så vi slår brukernavnet om til den interne adressen
  // kontoen ble opprettet med (se Auth.emailForUsername i js/auth.js).
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();
    const form = new FormData(loginForm);
    const username = String(form.get("username") || "").trim();
    if (!username) return showError("Skriv inn brukernavnet ditt.");

    const { error } = await sb.auth.signInWithPassword({
      email: Auth.emailForUsername(username),
      password: form.get("password"),
    });
    if (error) {
      showError(Auth.friendlyAuthError(error));
      return;
    }
    window.location.href = "index.html";
  });

  // Nyregistrerte sendes rett til rabatten de får på premiesiden (så sant
  // premiesiden er skrudd på, ellers til forsiden).
  const AFTER_REGISTER = (window.STUDILLA_FEATURES && window.STUDILLA_FEATURES.levelsEnabled)
    ? "premier.html#velkomst"
    : "index.html";

  registerForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearMessages();
    const form = new FormData(registerForm);
    const username = form.get("username").trim();
    const password = form.get("password");

    const usernameError = Auth.validateUsername(username);
    if (usernameError) return showError(usernameError);

    const passwordError = Auth.validatePassword(password);
    if (passwordError) return showError(passwordError);

    try {
      if (await Auth.isUsernameTaken(username)) {
        return showError("Dette brukernavnet er allerede tatt.");
      }
    } catch (err) {
      return showError(Auth.friendlyAuthError(err));
    }

    const { data, error } = await sb.auth.signUp({
      email: Auth.emailForUsername(username),
      password,
      options: { data: { username } },
    });

    if (error) return showError(Auth.friendlyAuthError(error));

    if (data.session) {
      window.location.href = AFTER_REGISTER;
    } else {
      showSuccess("Konto opprettet! Du kan nå logge inn med brukernavnet og passordet ditt.");
      registerForm.reset();
    }
  });
})();
</script>
</body>
</html>
