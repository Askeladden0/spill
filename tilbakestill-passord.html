<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Nytt passord</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="assets/img/favicon.svg" color="#2ee87f">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<div class="page">

  <div id="site-header"></div>

  <main>
    <section style="display:flex;justify-content:center">
      <div class="auth-card">
        <h1 style="margin:0 0 4px;font-size:20px;font-weight:800;color:#fff">Velg nytt passord</h1>

        <p class="auth-error" data-auth-error hidden></p>
        <p class="auth-success" data-auth-success hidden></p>

        <p class="section-sub" data-waiting-note>Åpner lenken fra e-posten din …</p>

        <form data-reset-form hidden>
          <label class="auth-field">
            <span>Nytt passord</span>
            <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minst 8 tegn, med bokstav og tall">
          </label>
          <label class="auth-field">
            <span>Gjenta passord</span>
            <input type="password" name="password2" required minlength="8" autocomplete="new-password">
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Lagre nytt passord</button>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabaseClient;
  const Auth = window.StudillaAuth;

  const waitingNote = document.querySelector("[data-waiting-note]");
  const resetForm = document.querySelector("[data-reset-form]");
  const errorEl = document.querySelector("[data-auth-error]");
  const successEl = document.querySelector("[data-auth-success]");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.hidden = false;
    successEl.hidden = true;
  }

  function showSuccess(msg) {
    successEl.textContent = msg;
    successEl.hidden = false;
    errorEl.hidden = true;
  }

  function revealForm() {
    waitingNote.hidden = true;
    resetForm.hidden = false;
  }

  // Supabase-js gjenkjenner selv "recovery"-lenken i URL-en og oppretter en
  // midlertidig sesjon, og fyrer PASSWORD_RECOVERY når den er klar. Sjekker
  // også om det allerede finnes en sesjon ved lasting (i tilfelle eventen
  // rakk å fyre før denne lytteren ble lagt til).
  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") revealForm();
  });

  (async function init() {
    const session = await Auth.getSession();
    if (session) revealForm();
    else {
      window.setTimeout(() => {
        if (resetForm.hidden) {
          waitingNote.textContent = "Fant ingen gyldig lenke. Be om en ny tilbakestillingslenke fra innloggingssiden.";
        }
      }, 3000);
    }
  })();

  resetForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    successEl.hidden = true;

    const form = new FormData(resetForm);
    const password = form.get("password");
    const password2 = form.get("password2");

    const passwordError = Auth.validatePassword(password);
    if (passwordError) return showError(passwordError);
    if (password !== password2) return showError("Passordene er ikke like.");

    const { error } = await sb.auth.updateUser({ password });
    if (error) return showError(Auth.friendlyAuthError(error));

    showSuccess("Passordet er oppdatert! Du blir sendt videre til forsiden …");
    resetForm.hidden = true;
    window.setTimeout(() => { window.location.href = "index.html"; }, 1800);
  });
})();
</script>
</body>
</html>
