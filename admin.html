<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Adminpanel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="assets/img/favicon.svg" color="#2ee87f">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">

<div class="admin-guard" data-admin-guard>Sjekker admin-tilgang …</div>

<div class="admin-shell" data-admin-shell hidden>

  <aside class="admin-sidebar">
    <a href="index.html" class="admin-sidebar-logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><rect x="3" y="10" width="6" height="11" rx="2.5" fill="#1f8f5f"/><rect x="13" y="4" width="6" height="17" rx="2.5" fill="#3ddc84"/></svg></span>
      <span class="logo-text">Studi<span>ll</span>a</span>
      <span class="admin-pill">ADMIN</span>
    </a>

    <button type="button" class="admin-search-trigger" data-open-palette>
      <span>⌕</span><span class="admin-search-label">Søk eller hopp til …</span>
      <span class="admin-kbd" data-palette-kbd>Ctrl K</span>
    </button>

    <nav class="admin-nav" data-admin-nav>
      <div class="admin-nav-group">
        <span class="admin-nav-label">OVERSIKT</span>
        <button type="button" class="admin-nav-link" data-nav="oversikt">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="4" width="6" height="17"></rect><rect x="15" y="9" width="6" height="12"></rect><rect x="3" y="12" width="6" height="9"></rect></svg>
          <span class="admin-nav-link-label">Oversikt</span>
        </button>
      </div>

      <div class="admin-nav-group">
        <span class="admin-nav-label">ADMINISTRER</span>
        <button type="button" class="admin-nav-link" data-nav="statistikk">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 4-7 5 5"></path><line x1="3" y1="21" x2="21" y2="21"></line></svg>
          <span class="admin-nav-link-label">Statistikk</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="brukere">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"></path></svg>
          <span class="admin-nav-link-label">Brukere</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="spill">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><rect x="2" y="6" width="20" height="12" rx="5"></rect></svg>
          <span class="admin-nav-link-label">Triks</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="nivaaer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
          <span class="admin-nav-link-label">Nivåer</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="rabatter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41L11 22l-9-9L11 2h9.59a2 2 0 0 1 2 2v9.41z" transform="scale(0.85) translate(1.7,1.7)"></path><circle cx="8.5" cy="8.5" r="1.5"></circle></svg>
          <span class="admin-nav-link-label">Rabatter</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="avatar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="10" r="3"></circle><path d="M6.6 19c1.2-2.1 3.1-3.1 5.4-3.1s4.2 1 5.4 3.1"></path></svg>
          <span class="admin-nav-link-label">Profilbilder</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="koder">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="3"></rect><line x1="9" y1="7" x2="9" y2="17"></line></svg>
          <span class="admin-nav-link-label">Rabattkoder</span>
        </button>
      </div>

      <div class="admin-nav-group">
        <span class="admin-nav-label">SENERE</span>
        <button type="button" class="admin-nav-link" data-nav="drift">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"></line><circle cx="15" cy="9" r="2.2"></circle><line x1="4" y1="16" x2="20" y2="16"></line><circle cx="9" cy="16" r="2.2"></circle></svg>
          <span class="admin-nav-link-label">Drift</span>
          <span class="admin-nav-soon">Snart</span>
        </button>
      </div>
    </nav>

    <div class="admin-sidebar-user" data-sidebar-user>
      <span class="admin-icon-badge">…</span>
      <span class="admin-sidebar-user-meta">
        <span class="admin-sidebar-user-name" data-sidebar-user-name>—</span>
        <span class="admin-sidebar-user-role">Administrator</span>
      </span>
      <a href="index.html" class="admin-sidebar-user-link">Til siden ↗</a>
    </div>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <div class="admin-topbar-titles">
        <span class="admin-topbar-eyebrow">ADMIN</span>
        <h1 data-view-title>Oversikt</h1>
      </div>
      <span class="admin-topbar-hint" data-view-hint></span>
    </header>

    <main class="admin-main" data-admin-main>Laster …</main>
  </div>
</div>

<div class="admin-palette-overlay" data-palette-overlay hidden>
  <button type="button" class="admin-palette-backdrop" data-close-palette aria-label="Lukk"></button>
  <div class="admin-palette">
    <div class="admin-palette-head">
      <span>⌕</span>
      <input type="text" placeholder="Hopp til seksjon, spill, nivå eller bruker …" data-palette-input autocomplete="off">
      <span class="admin-kbd">ESC</span>
    </div>
    <div class="admin-palette-results" data-palette-results></div>
  </div>
</div>

<div class="admin-toast" data-toast hidden></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/games-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
