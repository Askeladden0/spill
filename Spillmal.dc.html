<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0d1117; color:#e8edf5; font-family:'Poppins', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  * { box-sizing:border-box; }
  a { color:#2ee87f; text-decoration:none; }
  a:hover { color:#5cf5a0; }
  ::selection { background:#2ee87f; color:#0d1117; }
</style>
</helmet>
<div style="min-height:100vh;background:#0d1117;color:#e8edf5;display:flex;flex-direction:column;padding-bottom:80px">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:32px;padding:0 32px;height:72px;background:#131a25;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:20">
    <div style="display:flex;align-items:center;gap:36px">
      <a href="index.html" style="display:flex;align-items:center;gap:10px">
        <span style="width:30px;height:30px;border-radius:9px;background:#2ee87f;display:flex;align-items:center;justify-content:center;color:#0d1117;font-weight:800;font-size:16px;flex-shrink:0">P</span>
        <span style="font-size:20px;font-weight:800;letter-spacing:-.02em;color:#ffffff">PIXEL<span style="color:#2ee87f">PLAY</span></span>
      </a>
      <nav style="display:flex;align-items:center;gap:8px">
        <a href="index.html#spill" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;background:rgba(46,232,127,.12);color:#2ee87f;font-size:14px;font-weight:600" style-hover="background:rgba(46,232,127,.2);color:#2ee87f">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><line x1="6" y1="11" x2="10" y2="11"></line><line x1="8" y1="9" x2="8" y2="13"></line><line x1="15" y1="12" x2="15.01" y2="12"></line><line x1="18" y1="10" x2="18.01" y2="10"></line><rect x="2" y="6" width="20" height="12" rx="5"></rect></svg>
          Spill
        </a>
        <a href="premier.html" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;color:#96a3b8;font-size:14px;font-weight:600" style-hover="color:#e8edf5;background:rgba(255,255,255,.05)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
          Premier
        </a>
        <a href="rangering.html" style="display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:10px;color:#96a3b8;font-size:14px;font-weight:600" style-hover="color:#e8edf5;background:rgba(255,255,255,.05)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><rect x="9" y="4" width="6" height="17"></rect><rect x="15" y="9" width="6" height="12"></rect><rect x="3" y="12" width="6" height="9"></rect></svg>
          Rangering
        </a>
      </nav>
    </div>

    <div style="display:flex;align-items:center;gap:14px">
      <div style="display:flex;align-items:center;gap:12px;padding:8px 14px 8px 12px;border-radius:12px;background:#0d1117;border:1px solid rgba(255,255,255,.09)">
        <div style="display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;background:rgba(46,232,127,.12);color:#2ee87f;font-size:12px;font-weight:800;flex-shrink:0">4</div>
        <div style="display:flex;flex-direction:column;gap:5px;width:132px">
          <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:#96a3b8;letter-spacing:.02em"><span>NIVÅ 4</span><span style="color:#e8edf5">620/1000</span></div>
          <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden"><div style="height:100%;border-radius:99px;width:62%;background:linear-gradient(90deg,#2ee87f,#5cf5a0)"></div></div>
        </div>
      </div>
      <a href="profil.html" style="display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:#0d1117;color:#e8edf5;font-size:14px;font-weight:600;white-space:nowrap" style-hover="border-color:rgba(46,232,127,.5)">
        <span style="display:inline-flex;align-items:center;justify-content:center;border-radius:9px;width:30px;height:30px;font-size:17px;line-height:1;background:#2ee87f22;border:1px solid #2ee87f66;flex-shrink:0">🎮</span>
        <span>spillfan_92</span>
      </a>
    </div>
  </header>

  <main style="max-width:1240px;margin:0 auto;padding:22px 32px 0;display:flex;flex-direction:column;gap:20px;width:100%;flex:1">

    <a href="index.html#spill" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#96a3b8;align-self:flex-start" style-hover="color:#2ee87f">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Tilbake til alle spill
    </a>

    <div style="position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.09);background:#131a25;display:flex;flex-direction:column;gap:18px;padding:24px 28px 28px">

      <div style="width:min(460px,90vw);align-self:center;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#ffffff">{{ gameName }}</h1>
        <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
          <button type="button" onClick="{{ restart }}" style="padding:10px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:transparent;color:#e8edf5;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:border-color .15s ease,color .15s ease" style-hover="border-color:rgba(46,232,127,.5);color:#2ee87f">Nytt spill</button>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
        <div style="width:min(460px,90vw);aspect-ratio:1;border-radius:16px;background:#0d1117;border:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;padding:14px;gap:14px;background-image:repeating-linear-gradient(135deg,#131a25 0 12px,#161e2b 12px 24px)">
          <div style="display:flex;align-items:flex-start;gap:12px">
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:11px;font-weight:700;letter-spacing:.08em;color:#7c8aa0;text-transform:uppercase">Poeng</span>
              <span style="align-self:flex-start;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:24px;font-weight:800;color:#ffffff;font-variant-numeric:tabular-nums;line-height:1.15">{{ scoreText }}</span>
            </div>
            <sc-if value="{{ showRecord }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:4px">
                <span style="font-size:11px;font-weight:700;letter-spacing:.08em;color:#7c8aa0;text-transform:uppercase">Rekord</span>
                <span style="align-self:flex-start;padding:4px 12px;border-radius:10px;background:rgba(46,232,127,.07);border:1px solid rgba(46,232,127,.2);font-size:24px;font-weight:800;color:#2ee87f;font-variant-numeric:tabular-nums;line-height:1.15">{{ bestText }}</span>
              </div>
            </sc-if>
          </div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center">
            <span style="font-family:ui-monospace, Menlo, monospace;font-size:12px;color:#6b7b93;letter-spacing:.06em">[ spillområde ]</span>
          </div>
        </div>
      </div>

      <sc-if value="{{ showGameOver }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;background:rgba(13,17,23,.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;border-radius:20px">
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:32px;max-width:320px">
            <h3 style="margin:0;font-size:22px;font-weight:800;color:#ffffff">Spillet er over</h3>
            <p style="margin:0;font-size:15px;color:#e8edf5">Du fikk {{ scoreText }} poeng.</p>
            <p style="margin:0;font-size:13px;font-weight:500;color:#7c8aa0">Rekord: {{ bestText }} poeng.</p>
            <button type="button" onClick="{{ restart }}" style="margin-top:6px;padding:16px 32px;border:none;border-radius:12px;background:#2ee87f;color:#0d1117;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:-.01em;cursor:pointer" style-hover="background:#5cf5a0">Spill igjen</button>
          </div>
        </div>
      </sc-if>
    </div>
  </main>

  <footer style="max-width:1240px;margin:64px auto 0;padding:24px 32px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.09);width:100%">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:24px;height:24px;border-radius:7px;background:#2ee87f;display:flex;align-items:center;justify-content:center;color:#0d1117;font-weight:800;font-size:13px">P</span>
      <span style="font-size:13px;font-weight:500;color:#7c8aa0">© 2026 PixelPlay</span>
    </div>
    <nav style="display:flex;align-items:center;gap:28px">
      <a href="#kontakt" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Kontakt</a>
      <a href="#personvern" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Personvern</a>
      <a href="#vilkar" style="font-size:13.5px;font-weight:600;color:#96a3b8" style-hover="color:#2ee87f">Vilkår</a>
    </nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;gameName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2048&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;score&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1240,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0},&quot;best&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3480,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0},&quot;showRecord&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showGameOver&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { score: null };
  fmt(n) { return Number(n || 0).toLocaleString("no-NO"); }
  renderVals() {
    const score = this.state.score ?? this.props.score ?? 1240;
    return {
      gameName: this.props.gameName ?? "2048",
      scoreText: this.fmt(score),
      bestText: this.fmt(this.props.best ?? 3480),
      showRecord: this.props.showRecord ?? true,
      showGameOver: this.props.showGameOver ?? false,
      restart: () => this.setState({ score: 0 })
    };
  }
}
</script>
</body>
</html>
