<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Adminpanel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css" data-studilla-head>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/social.css">
</head>
<body data-page="admin">

<div class="admin-guard" data-admin-guard>Sjekker admin-tilgang …</div>

<div class="admin-shell" data-admin-shell hidden>

  <aside class="admin-sidebar">
    <a href="index.html" class="admin-sidebar-logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><rect x="3" y="10" width="6" height="11" rx="2.5" fill="#1f8f5f"/><rect x="13" y="4" width="6" height="17" rx="2.5" fill="#3ddc84"/></svg></span>
      <span class="logo-text">Studi<span>ll</span>a</span>
      <span class="admin-pill">ADMIN</span>
    </a>

    <button type="button" class="admin-search-trigger" data-open-palette>
      <span>⌕</span><span class="admin-search-label">Søk eller hopp til …</span>
      <span class="admin-kbd" data-palette-kbd>Ctrl K</span>
    </button>

    <nav class="admin-nav" data-admin-nav>
      <div class="admin-nav-group">
        <span class="admin-nav-label">OVERSIKT</span>
        <button type="button" class="admin-nav-link" data-nav="oversikt">
          <span class="admin-nav-link-label">Oversikt</span>
        </button>
      </div>

      <div class="admin-nav-group">
        <span class="admin-nav-label">ADMINISTRER</span>
        <button type="button" class="admin-nav-link" data-nav="statistikk">
          <span class="admin-nav-link-label">Statistikk</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="varsler">
          <span class="admin-nav-link-label">Varsler</span>
          <span class="admin-nav-count" data-nav-notifications hidden></span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="blokkeringer">
          <span class="admin-nav-link-label">Blokkeringer</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="brukere">
          <span class="admin-nav-link-label">Brukere</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="spill">
          <span class="admin-nav-link-label">Triks</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="nivaaer">
          <span class="admin-nav-link-label">Nivåer</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="lykkehjul">
          <span class="admin-nav-link-label">Lykkehjul</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="rabatter">
          <span class="admin-nav-link-label">Rabatter</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="avatar">
          <span class="admin-nav-link-label">Profilbilder</span>
        </button>
        <button type="button" class="admin-nav-link" data-nav="koder">
          <span class="admin-nav-link-label">Rabattkoder</span>
        </button>
      </div>

      <div class="admin-nav-group">
        <span class="admin-nav-label">SENERE</span>
        <button type="button" class="admin-nav-link" data-nav="drift">
          <span class="admin-nav-link-label">Drift</span>
          <span class="admin-nav-soon">Snart</span>
        </button>
      </div>
    </nav>

    <div class="admin-sidebar-user" data-sidebar-user>
      <span class="admin-icon-badge">…</span>
      <span class="admin-sidebar-user-meta">
        <span class="admin-sidebar-user-name" data-sidebar-user-name>—</span>
        <span class="admin-sidebar-user-role">Administrator</span>
      </span>
      <a href="index.html" class="admin-sidebar-user-link">Til siden ↗</a>
    </div>
  </aside>

  <div class="admin-content">
    <header class="admin-topbar">
      <div class="admin-topbar-titles">
        <span class="admin-topbar-eyebrow">ADMIN</span>
        <h1 data-view-title>Oversikt</h1>
      </div>
      <span class="admin-topbar-hint" data-view-hint></span>
    </header>

    <main class="admin-main" data-admin-main>Laster …</main>
  </div>
</div>

<div class="admin-palette-overlay" data-palette-overlay hidden>
  <button type="button" class="admin-palette-backdrop" data-close-palette aria-label="Lukk"></button>
  <div class="admin-palette">
    <div class="admin-palette-head">
      <span>⌕</span>
      <input type="text" placeholder="Hopp til seksjon, spill, nivå eller bruker …" data-palette-input autocomplete="off">
      <span class="admin-kbd">ESC</span>
    </div>
    <div class="admin-palette-results" data-palette-results></div>
  </div>
</div>

<div class="admin-toast" data-toast hidden></div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/visit-tracking.js"></script>
<script src="js/games-data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
