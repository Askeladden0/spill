<!DOCTYPE html>
<html lang="no">
<head>
<!-- Premiesiden er skrudd av for den live siden (se js/feature-flags.js) uten
     at siden/koden fjernes: en utilgjengelig premier.html sender besøkende
     videre til forsiden i stedet for å vise siden. -->
<script src="js/feature-flags.js"></script>
<script>
  if (!(window.STUDILLA_FEATURES && window.STUDILLA_FEATURES.levelsEnabled)) {
    window.location.replace("index.html");
  }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Premier og rabattkoder</title>
<meta name="description" content="Se hvilke rabattkoder og premier du kan låse opp med poengene dine hos Studilla.">
<meta property="og:title" content="Studilla · Premier og rabattkoder">
<meta property="og:description" content="Se hvilke rabattkoder og premier du kan låse opp med poengene dine hos Studilla.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="stylesheet" href="css/style.css" data-studilla-head>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/social.css">
</head>
<body data-page="premier">
<div class="page">

  <div id="site-header"></div>

  <main id="hovedinnhold">
    <section class="premier-hero-grid">
      <div class="level-card">
        <div class="level-ring-wrap" data-level-ring-wrap>
          <div class="level-ring-tooltip" data-level-tooltip>– poeng totalt</div>
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="58" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="11"></circle>
            <circle cx="66" cy="66" r="58" fill="none" style="stroke:var(--accent)" stroke-width="11" stroke-linecap="round"
              stroke-dasharray="364.4" stroke-dashoffset="364.4" data-level-ring-progress
              style="transition:stroke-dashoffset .6s ease"></circle>
          </svg>
          <div class="level-ring-center">
            <span class="level-ring-num" data-level-num>–</span>
            <span class="level-ring-label">NIVÅ</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
          <h1 style="margin:0;font-size:30px;font-weight:700;letter-spacing:-.025em;color:#fff" data-level-headline>Laster nivå …</h1>
          <p style="margin:0;font-size:15px;line-height:1.6;color:var(--muted);max-width:46ch;text-wrap:pretty">Fullfør triks for å samle poeng og stige i nivå.</p>
          <div class="level-stats-row">
            <div class="level-stat">
              <span class="level-stat-num" data-stat-points>0</span>
              <span class="level-stat-label">POENG TOTALT</span>
            </div>
          </div>
        </div>
      </div>

    </section>

    <section style="display:grid;grid-template-columns:1fr;gap:32px;align-items:start" class="premier-layout">

      <div style="display:flex;flex-direction:column;gap:32px;min-width:0">

        <div class="side-card" style="text-align:center;padding:40px 24px" data-soon hidden>
          <h2 style="margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff">Premier kommer snart!</h2>
        </div>

        <div data-my-codes-wrap hidden>
          <div class="section-heading spread">
            <h2 style="font-size:16px">Mine koder</h2>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px" data-my-codes></div>
        </div>

      </div>

    </section>

  </main>

  <div id="site-footer"></div>
</div>

<!-- Full info om en rabatt (når teksten ikke får plass på kortet) -->
<div class="modal-overlay" style="z-index:110" data-info-modal hidden>
  <div class="modal-backdrop" data-info-backdrop></div>
  <div class="modal-card" style="max-width:440px;align-items:stretch;text-align:left">
    <button type="button" class="modal-close" data-close-info aria-label="Lukk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg></button>
    <h2 class="modal-title" data-info-title>Info</h2>
    <p style="margin:0;font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere" data-info-text></p>
  </div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout-markup.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/snorre-tag.js"></script>
<script src="js/auth.js"></script>
<script src="js/social.js"></script>
<script src="js/dm-popup.js"></script>
<script src="js/visit-tracking.js"></script>
<script src="js/reward-use-tracking.js"></script>
<script>
(function () {
  "use strict";
  const sb = window.supabaseClient;
  const Auth = window.StudillaAuth;

  const RARITY = {
    vanlig: { label: "VANLIG", color: "#8d8799" },
    sjelden: { label: "SJELDEN", color: "#4b8ef0" },
    episk: { label: "EPISK", color: "#9d6bf5" },
    legendarisk: { label: "LEGENDARISK", color: "#f0b429" },
  };

  let profile = null;
  let levels = [];
  let openedCases = new Map(); // level_number -> { brand, title, sub, rarity, image_url, code }
  const WELCOME = "welcome"; // nøkkelen til velkomstbonusen i openedCases / valg

  function fmt(n) {
    return Math.round(n).toLocaleString("no-NO");
  }

  function currentPoints() {
    return profile ? profile.xp : Auth.getGuestPoints();
  }

  function computedLevelFromPoints(points) {
    let best = levels.length ? levels[0].level_number : 1;
    levels.forEach((lv) => {
      if (points >= lv.points_required) best = lv.level_number;
    });
    return best;
  }

  function displayLevel() {
    if (!levels.length) return profile ? profile.level : 1;
    // Nivået regnes alltid fra poengene. profiles.level går aldri ned, så etter
    // at nivåstigen er endret kan det stå igjen et for høyt nivå her.
    return computedLevelFromPoints(currentPoints());
  }

  function nextLevelInfo() {
    const dl = displayLevel();
    return levels.find((lv) => lv.level_number > dl) || null;
  }

  // ---------- Hero / nivå-kort ----------
  function renderLevelCard() {
    const points = currentPoints();
    const dl = displayLevel();
    const next = nextLevelInfo();

    document.querySelector("[data-level-num]").textContent = dl;

    const headline = document.querySelector("[data-level-headline]");
    if (next) {
      headline.textContent = `Du er ${fmt(Math.max(0, next.points_required - points))} poeng fra nivå ${next.level_number}`;
    } else {
      headline.textContent = "Du har nådd toppnivået! 🎉";
    }

    const ring = document.querySelector("[data-level-ring-progress]");
    const circumference = 364.4;
    let pct = 1;
    if (next) {
      const cur = levels.find((lv) => lv.level_number === dl);
      const lo = cur ? cur.points_required : 0;
      const span = Math.max(1, next.points_required - lo);
      pct = Math.min(1, Math.max(0, (points - lo) / span));
    }
    ring.style.strokeDashoffset = String(circumference * (1 - pct));

    document.querySelector("[data-stat-points]").textContent = fmt(points);
    document.querySelector("[data-level-tooltip]").textContent = `${fmt(points)} poeng totalt`;

  }

  // «Mine koder»: alle rabatter brukeren har åpnet, tegnet som samme kort som
  // vises når en rabatt trekkes (.case-reveal), nyeste først.
  function myCodeCardHTML(c) {
    const rar = RARITY[c.rarity] || RARITY.vanlig;
    const neon = window.StudillaSnorreTag ? window.StudillaSnorreTag.neonFor(c.code) : "";
    return `
      <div class="case-reveal" style="--reveal-color:${rar.color};animation:none" data-my-code-card data-title="${escapeHtml(c.title)} hos ${escapeHtml(c.brand)}" data-sub="${escapeHtml(c.sub || "")}">
        <span class="case-reveal-logo">${c.image_url ? `<img src="${escapeHtml(c.image_url)}" alt="">` : `<span>[ logo ]</span>`}</span>
        <h3 class="case-reveal-value" style="font-size:22px">${escapeHtml(c.title)} hos ${escapeHtml(c.brand)}</h3>
        ${c.supports_snorre && window.StudillaSnorreTag ? `<span>${window.StudillaSnorreTag.html()}</span>` : ""}
        <button type="button" class="case-reveal-code code-neon" style="background:${neon}" data-copy-code="${escapeHtml(c.code)}" aria-label="Kopier koden">
          <span class="case-reveal-code-label" data-copy-label>Din kode</span>
          <span class="case-reveal-code-row"><span class="case-reveal-code-value">${escapeHtml(c.code)}</span><svg class="case-reveal-code-copy" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"></rect><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"></path></svg></span>
        </button>
        ${c.link_url ? `<a class="case-reveal-use" style="background:${neon}" href="${escapeHtml(c.link_url)}" data-use-brand="${escapeHtml(c.brand)}" data-use-title="${escapeHtml(c.title)}" target="_blank" rel="noopener noreferrer">Bruk koden <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg></a>` : ""}
        <div class="case-reveal-sub" hidden>
          <span class="case-reveal-sub-label">Info</span>
          <p class="case-reveal-sub-text" data-sub-text></p>
          <button type="button" class="case-reveal-more" data-sub-more hidden>Se mer</button>
        </div>
      </div>`;
  }

  function renderMyCodes() {
    const wrap = document.querySelector("[data-my-codes-wrap]");
    const list = document.querySelector("[data-my-codes]");
    const mine = profile ? Array.from(openedCases.values()).filter((c) => c.code).reverse() : [];
    wrap.hidden = !mine.length;
    list.innerHTML = mine.map(myCodeCardHTML).join("");
    list.querySelectorAll("[data-my-code-card]").forEach((card) => {
      setupSub(card.querySelector(".case-reveal-sub"), card.dataset.sub, card.dataset.title);
    });
  }

  // Info under koden: klippes etter noen linjer, og «Se mer» åpner en pop-up
  // med hele teksten når den ikke får plass.
  function setupSub(box, text, title) {
    const more = box.querySelector("[data-sub-more]");
    const textEl = box.querySelector("[data-sub-text]");
    textEl.textContent = text || "";
    box.hidden = !text;
    more.hidden = true;
    more.dataset.title = title || "Info";
    more.dataset.full = text || "";
    if (text && textEl.scrollHeight > textEl.clientHeight + 1) more.hidden = false;
  }

  function openInfoModal(title, text) {
    document.querySelector("[data-info-title]").textContent = title;
    document.querySelector("[data-info-text]").textContent = text;
    document.querySelector("[data-info-modal]").hidden = false;
  }
  function closeInfoModal() { document.querySelector("[data-info-modal]").hidden = true; }

  document.addEventListener("click", (e) => {
    const more = e.target.closest("[data-sub-more]");
    if (more) { openInfoModal(more.dataset.title, more.dataset.full); return; }
    const copyEl = e.target.closest("[data-copy-code]");
    if (copyEl && navigator.clipboard) {
      navigator.clipboard.writeText(copyEl.dataset.copyCode).then(() => {
        const label = copyEl.querySelector("[data-copy-label]");
        if (!label) return;
        label.textContent = "Kopiert!";
        clearTimeout(copyEl._t);
        copyEl._t = setTimeout(() => { label.textContent = "Din kode"; }, 1500);
      });
    }
  });
  document.querySelector("[data-close-info]").addEventListener("click", closeInfoModal);
  document.querySelector("[data-info-backdrop]").addEventListener("click", closeInfoModal);

  // ---------- Sidepanel ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  // ---------- Init ----------
  async function loadLevels() {
    const res = await sb.from("levels").select("level_number, points_required").order("level_number");
    if (!res.error && res.data) levels = res.data;
  }

  function openedFromRow(row) {
    const rw = row.rewards;
    return {
      code: row.code,
      brand: rw ? rw.brand : "",
      title: rw ? rw.title : "",
      sub: rw ? rw.sub : "",
      rarity: rw ? rw.rarity : "vanlig",
      image_url: rw ? rw.image_url : null,
      link_url: rw ? rw.link_url : null,
      supports_snorre: !!(rw && rw.supports_snorre),
    };
  }

  // Prøver kolonnesettene i rekkefølge, så databaser uten rewards.link_url
  // eller rewards.supports_snorre fortsatt får vist rabattene sine.
  async function selectCases(table, key) {
    for (const cols of [
      "brand, title, sub, rarity, image_url, link_url, supports_snorre",
      "brand, title, sub, rarity, image_url, link_url",
      "brand, title, sub, rarity, image_url",
    ]) {
      const res = await sb.from(table).select(`${key}code, rewards(${cols})`).eq("user_id", profile.id);
      if (!res.error) return res.data || [];
    }
    return [];
  }

  async function loadOpenedCases() {
    openedCases = new Map();
    if (!profile) return;
    const [levelRows, welcomeRows] = await Promise.all([
      selectCases("user_level_cases", "level_number, "),
      selectCases("user_welcome_cases", ""),
    ]);
    levelRows.forEach((row) => openedCases.set(row.level_number, openedFromRow(row)));
    welcomeRows.forEach((row) => openedCases.set(WELCOME, openedFromRow(row)));
  }

  // Har brukeren koder (fra tidligere rabatter eller velkomstbonusen) vises
  // «Mine koder»; alle andre får beskjeden om at premier kommer snart.
  function renderSoon() {
    document.querySelector("[data-soon]").hidden = openedCases.size > 0;
  }

  async function refresh() {
    profile = await Auth.getCurrentProfile();
    await Promise.all([loadLevels(), loadOpenedCases()]);
    renderLevelCard();
    renderMyCodes();
    renderSoon();
  }

  refresh();
  sb.auth.onAuthStateChange(refresh);
})();
</script>
</body>
</html>
