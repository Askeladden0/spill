<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Studilla",
  "description": "Nye triks hver dag – slå din egen rekord og se hvem av vennene dine som ligger foran."
}
</script>

<body data-page="spill">
<div class="page">

  <div id="site-header"></div>

  <main id="hovedinnhold">
    <!-- Hilsen fra Snorre i full bredde øverst. -->
    <section class="hero-section">
      <div class="hero-greeting">
        <h1>Hellu:) Hyggelig å se deg!</h1>
        <p class="hero-lead">
          Jeg har drevet og bygget denne nettsiden de siste ukene etter det ble satt inn
          nettfiltre i Osloskolen. Gjerne send meg en melding her eller på TikTok med
          tilbakemeldinger.
        </p>
        <div class="hero-byline">
          <img src="assets/img/snorre-saus-avatar.jpeg" alt="" width="28" height="28">
          <span>Snorre Saus</span>
          <span class="hero-byline-sep">·</span>
          <a href="kontakt.html">Send en melding</a>
        </div>
      </div>
    </section>

    <!-- Teaser for velkomstrabatten (js/case-teaser.js). Samme boks som på
         premiesiden; vises ikke når rabatten allerede er åpnet. -->
    <section class="case-teaser" data-case-teaser hidden></section>

    <section id="alle">
      <div class="game-grid" data-game-grid></div>
    </section>

    <!-- Guidene lå tidligere som en isolert øy bak ett menypunkt. Forsiden
         viser nå den fremhevede guiden i full bredde, med én vei videre til
         resten – i stedet for en rad med små kort. -->
    <section data-front-guide-section hidden>
      <div data-front-guide></div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>
