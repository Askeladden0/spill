<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Rangering</title>
<meta name="description" content="Se hvem som topper poenglisten hos Studilla.">
<meta property="og:title" content="Studilla · Rangering">
<meta property="og:description" content="Se hvem som topper poenglisten hos Studilla.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="stylesheet" href="css/style.css" data-studilla-head>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/social.css">
</head>
<body data-page="rangering">
<div class="page">

  <div id="site-header"></div>

  <main id="hovedinnhold">
    <section>
      <div class="section-heading spread" style="align-items:flex-end;flex-wrap:wrap;gap:20px">
        <div>
          <h1>Rangering</h1>
          <span class="section-sub" data-rank-subtitle>Laster rangering …</span>
        </div>
        <div class="rank-search-wrap">
          <input type="search" class="rank-search-input" placeholder="Søk etter en spiller …" data-search-input autocomplete="off">
          <div class="rank-search-results" data-search-results hidden></div>
        </div>
      </div>

      <!-- To nivåer av filtre: først HVILKEN liste (alle tider / denne uka /
           venner), så hvilket triks. Ukeslista og vennelista er det som gjør
           rangeringen mulig å vinne for en fersk spiller. -->
      <div class="scope-chips is-primary" data-board-chips style="margin-bottom:12px" role="tablist" aria-label="Velg rangering"></div>
      <div class="scope-chips" data-scope-chips style="margin-bottom:22px"></div>

      <div class="rank-hero-grid" style="margin-bottom:22px">
        <div data-rank-me-slot></div>
        <div class="rank-podium-card">
          <span class="rank-podium-title" data-podium-title>TOPP 3</span>
          <div class="rank-podium-list" data-podium-list></div>
        </div>
      </div>

      <div class="leaderboard-panel" data-leaderboard-panel>
        <div class="leaderboard-head">
          <span>PLASS</span><span>SPILLER</span><span data-levels-only>NIVÅ</span><span>KAMPER</span><span>POENG</span>
        </div>
        <div class="leaderboard-body" data-leaderboard-body>
          <div class="leaderboard-empty">Laster brukere …</div>
        </div>
        <div class="leaderboard-foot">
          <span class="section-sub" data-shown-label></span>
          <button type="button" class="btn-outline" data-toggle-rows hidden>Vis alle</button>
        </div>
      </div>
    </section>

    <section data-mygames-section hidden>
      <div class="section-heading"><h2>Din score per triks</h2></div>
      <div class="mygames-grid" data-mygames-grid></div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout-markup.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/social.js"></script>
<script src="js/visit-tracking.js"></script>
<script src="js/games-data.js"></script>
<script src="js/leaderboard-data.js"></script>
<script src="js/main.js"></script>
<script>
(function () {
  "use strict";
  const Auth = window.StudillaAuth;
  const LB = window.StudillaLeaderboard;
  const games = LB.games;
  const LEVELS_ENABLED = !!(window.STUDILLA_FEATURES && window.STUDILLA_FEATURES.levelsEnabled);

  const VISIBLE_ROWS = 20;
  const MEDAL_COLORS = ["#f5c451", "#c9d2de", "#d08a52"];

  let profile = null;
  let profiles = [];
  let boards = { total: [], perGame: {} };
  let weeklyBoard = null;
  let friendIds = [];
  let scope = "total";
  // Hvilken liste: "all" = alle tider, "week" = denne uka, "friends" = de du følger.
  // Heter bevisst noe annet enn de lokale `board`-variablene i render-
  // funksjonene under, som holder selve LISTEN med spillere.
  let boardScope = "all";
  let expanded = false;

  const BOARDS = [
    { id: "all", label: "Alle tider" },
    { id: "week", label: "Denne uka" },
    { id: "friends", label: "Vennene mine" },
  ];

  function fmt(n) {
    return Math.round(n || 0).toLocaleString("no-NO");
  }

  function scopeLabel(s) {
    if (s === "total") return "Alle triks samlet";
    const g = games.find((x) => x.id === s);
    return g ? g.name : s;
  }

  function boardLabel() {
    const b = BOARDS.find((x) => x.id === boardScope);
    return b ? b.label : "Alle tider";
  }

  function currentBoard() {
    // Ukeslista finnes bare samlet (ikke per triks): der er tallet summen av
    // beste runde per triks denne uka, så et per-triks-utvalg ville vært en
    // annen beregning enn den databasen gjør.
    if (boardScope === "week") return weeklyBoard || [];
    const base = scope === "total" ? boards.total : boards.perGame[scope] || [];
    if (boardScope === "friends") return LB.buildFriendsBoard(base, friendIds, profile && profile.id);
    return base;
  }

  function playerLink(p) {
    return `spillerprofil.html?u=${encodeURIComponent(p.username)}`;
  }

  function renderBoardChips() {
    const host = document.querySelector("[data-board-chips]");
    host.innerHTML = BOARDS.map((b) => `
      <button type="button" role="tab" aria-selected="${boardScope === b.id}"
        class="scope-chip ${boardScope === b.id ? "is-active" : ""}" data-board="${b.id}">${b.label}</button>
    `).join("");

    host.querySelectorAll("[data-board]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        boardScope = btn.dataset.board;
        expanded = false;
        // Ukeslista hentes først når noen faktisk ber om den.
        if (boardScope === "week" && !weeklyBoard) {
          const weekly = await LB.loadWeekly(0);
          weeklyBoard = weekly ? LB.buildWeeklyBoard(profiles, weekly) : [];
        }
        renderAll();
      });
    });
  }

  function renderScopeChips() {
    // Per-triks-utvalget gir ikke mening på ukeslista (se currentBoard).
    const host = document.querySelector("[data-scope-chips]");
    host.hidden = boardScope === "week";
    if (host.hidden) return;

    const items = [{ id: "total", label: "Alle triks samlet" }].concat(
      games.map((g) => ({ id: g.id, label: g.name, game: g }))
    );
    document.querySelector("[data-scope-chips]").innerHTML = items
      .map(
        (c) => `
        <button type="button" class="scope-chip ${scope === c.id ? "is-active" : ""}" data-scope="${c.id}">${c.game ? window.gameIconHTML(c.game, 16) : ""}${c.label}</button>
      `
      )
      .join("");

    document.querySelectorAll("[data-scope]").forEach((btn) => {
      btn.addEventListener("click", () => {
        scope = btn.dataset.scope;
        expanded = false;
        renderAll();
      });
    });
  }

  function renderMeCard() {
    const slot = document.querySelector("[data-rank-me-slot]");
    const board = currentBoard();

    if (!profile) {
      slot.innerHTML = `
        <div class="rank-me-guest">
          <span class="section-sub">Logg inn for å se din plassering og få poeng registrert på rangeringen.</span>
          <a href="login.html" class="btn-primary btn-link">Logg inn</a>
        </div>
      `;
      return;
    }

    const me = board.find((p) => p.id === profile.id);
    if (!me) {
      slot.innerHTML = `
        <div class="rank-me-guest">
          <span class="section-sub">Du har ikke spilt «${scopeLabel(scope)}» ennå, så du er ikke rangert her.</span>
          <a href="index.html#spill" class="btn-primary btn-link">Finn et triks</a>
        </div>
      `;
      return;
    }

    const ahead = board[Math.max(0, me.rank - 2)];
    const gap = ahead && ahead.id !== me.id ? ahead.score - me.score : 0;
    const gapText = gap > 0
      ? `${fmt(gap)} poeng opp til plass ${me.rank - 1}`
      : "Du er på topp i denne listen";

    slot.innerHTML = `
      <div class="rank-me-card">
        <div class="rank-me-badge">
          <span class="rank-me-badge-label">PLASS</span>
          <span class="rank-me-badge-num">${me.rank}</span>
          <span class="rank-me-badge-of">av ${fmt(board.length)}</span>
        </div>
        <div class="rank-me-body">
          <div class="rank-me-identity">
            ${Auth.avatarHTML(me, 34)}
            <div style="display:flex;flex-direction:column">
              <span class="rank-me-name">Deg — ${me.username}</span>
              <span class="rank-me-scope">${scopeLabel(scope)}${LEVELS_ENABLED ? ` · Nivå ${me.level}` : ""}</span>
            </div>
          </div>
          <div class="rank-me-stats">
            <div class="rank-me-stat">
              <span class="rank-me-stat-num">${fmt(me.score)}</span>
              <span class="rank-me-stat-label">POENG</span>
            </div>
            <div class="rank-me-stat">
              <span class="rank-me-stat-num is-plain">${fmt(me.matches)}</span>
              <span class="rank-me-stat-label">KAMPER</span>
            </div>
          </div>
          <span class="rank-me-gap">${gapText}</span>
        </div>
      </div>
    `;
  }

  function renderPodium() {
    const board = LB.visiblePlayers(currentBoard());
    document.querySelector("[data-podium-title]").textContent =
      `TOPP 3 · ${(boardScope === "week" ? boardLabel() : scopeLabel(scope)).toUpperCase()}`;
    const list = document.querySelector("[data-podium-list]");

    if (!board.length) {
      list.innerHTML = `<span class="rank-podium-empty">Ingen brukere ennå.</span>`;
      return;
    }

    list.innerHTML = board
      .slice(0, 3)
      .map(
        (p, i) => `
        <a class="rank-podium-row" href="${playerLink(p)}">
          <span class="rank-podium-medal" style="background:${MEDAL_COLORS[i]}">${p.rank}</span>
          ${Auth.avatarHTML(p, 30)}
          <span class="rank-podium-name">${p.username}</span>
          <span class="rank-podium-score">${fmt(p.score)}</span>
        </a>
      `
      )
      .join("");
  }

  function renderTable() {
    const fullBoard = currentBoard();
    const board = LB.visiblePlayers(fullBoard);
    const body = document.querySelector("[data-leaderboard-body]");
    const toggleBtn = document.querySelector("[data-toggle-rows]");
    const shownLabel = document.querySelector("[data-shown-label]");

    if (!board.length) {
      body.innerHTML = boardScope === "friends"
        ? `<div class="leaderboard-empty">Du følger ingen ennå. Søk opp en spiller her eller på <a href="meldinger.html">Venner</a> for å få en liste du faktisk kan vinne.</div>`
        : boardScope === "week"
          ? `<div class="leaderboard-empty">Ingen har spilt noe denne uka ennå. Bli den første!</div>`
          : `<div class="leaderboard-empty">Ingen har spilt «${scopeLabel(scope)}» ennå. Bli den første!</div>`;
      shownLabel.textContent = "";
      toggleBtn.hidden = true;
      return;
    }

    const visible = expanded ? board : board.slice(0, VISIBLE_ROWS);
    const meInVisible = profile && visible.some((p) => p.id === profile.id);
    const me = profile && fullBoard.find((p) => p.id === profile.id);
    const shown = me && !meInVisible ? visible.concat([me]) : visible;

    body.innerHTML = shown
      .map(
        (p) => `
        <a class="leaderboard-row ${profile && p.id === profile.id ? "is-me" : ""}" href="${playerLink(p)}">
          <span class="leaderboard-rank ${p.rank <= 3 ? "is-top" : ""}">${p.rank}</span>
          <span class="leaderboard-player">
            ${Auth.avatarHTML(p, 30)}
            <span class="leaderboard-player-name">${p.username}</span>
            ${profile && p.id === profile.id ? '<span class="you-badge">DEG</span>' : ""}
          </span>
          ${LEVELS_ENABLED ? `<span class="leaderboard-level">${p.level}</span>` : ""}
          <span class="leaderboard-matches">${fmt(p.matches)}</span>
          <span class="leaderboard-score">${fmt(p.score)}</span>
        </a>
      `
      )
      .join("");

    shownLabel.textContent = `Viser ${shown.length} av ${board.length} spillere`;
    toggleBtn.hidden = board.length <= VISIBLE_ROWS;
    toggleBtn.textContent = expanded ? "Vis færre" : `Vis alle ${board.length}`;
  }

  function renderMyGames() {
    const section = document.querySelector("[data-mygames-section]");
    if (!profile) {
      section.hidden = true;
      return;
    }
    section.hidden = false;

    const maxScore = Math.max(1, ...games.map((g) => {
      const board = boards.perGame[g.id] || [];
      return board.length ? board[0].score : 1;
    }));

    document.querySelector("[data-mygames-grid]").innerHTML = games
      .map((g) => {
        const board = boards.perGame[g.id] || [];
        const me = board.find((p) => p.id === profile.id);
        const pct = me ? Math.max(4, Math.round((me.score / maxScore) * 100)) : 0;
        return `
          <a class="mygame-card" href="player.html?id=${encodeURIComponent(g.id)}">
            <div class="mygame-head">
              <span style="display:flex;align-items:center;gap:8px">
                ${window.gameIconHTML(g, 22)}
                <span class="mygame-name">${g.name}</span>
              </span>
            </div>
            <div class="mygame-stats">
              <div>
                <div class="mygame-score">${me ? fmt(me.score) : "–"}</div>
                <span class="mygame-label">POENG</span>
              </div>
              <div style="text-align:right">
                <div class="mygame-rank">${me ? "#" + me.rank : "Ikke spilt"}</div>
                <span class="mygame-label">PLASSERING</span>
              </div>
            </div>
            <div class="mygame-bar"><div class="mygame-bar-fill" style="width:${pct}%"></div></div>
          </a>
        `;
      })
      .join("");
  }

  function renderSubtitle() {
    const n = fmt(LB.visiblePlayers(currentBoard()).length);
    const what = boardScope === "week" ? "Denne uka" : scopeLabel(scope);
    document.querySelector("[data-rank-subtitle]").textContent =
      boardScope === "friends"
        ? `${what} · blant deg og de ${friendIds.length} du følger`
        : `${what} · ${n} spillere rangert`;
  }

  function renderAll() {
    renderBoardChips();
    renderScopeChips();
    renderSubtitle();
    renderMeCard();
    renderPodium();
    renderTable();
    renderMyGames();
  }

  document.querySelector("[data-toggle-rows]").addEventListener("click", () => {
    expanded = !expanded;
    renderTable();
  });

  // ---------- Søk ----------
  const searchInput = document.querySelector("[data-search-input]");
  const searchResults = document.querySelector("[data-search-results]");

  function renderSearch(query) {
    const q = query.trim().toLowerCase();
    if (!q) {
      searchResults.hidden = true;
      searchResults.innerHTML = "";
      return;
    }

    const matches = LB.visiblePlayers(profiles)
      .filter((p) => p.username.toLowerCase().includes(q))
      .sort((a, b) => b.xp - a.xp)
      .slice(0, 8);

    searchResults.innerHTML = matches.length
      ? matches
          .map(
            (p) => `
            <a class="rank-search-result" href="${playerLink(p)}">
              ${Auth.avatarHTML(p, 32)}
              <span class="rank-search-name">${p.username}</span>
              <span class="rank-search-meta">${LEVELS_ENABLED ? `Nivå ${p.level} · ` : ""}${fmt(p.xp)} p</span>
            </a>
          `
          )
          .join("")
      : `<div class="rank-search-empty">Fant ingen brukere som matcher «${query}».</div>`;

    searchResults.hidden = false;
  }

  searchInput.addEventListener("input", (e) => renderSearch(e.target.value));
  searchInput.addEventListener("focus", (e) => {
    if (e.target.value.trim()) renderSearch(e.target.value);
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".rank-search-wrap")) searchResults.hidden = true;
  });

  // ---------- Init ----------
  async function init() {
    if (!LEVELS_ENABLED) {
      document.querySelector("[data-leaderboard-panel]").classList.add("levels-hidden");
    }
    if (window.STUDILLA_GAMES_READY) await window.STUDILLA_GAMES_READY;
    profile = await Auth.getCurrentProfile();
    const [loadedProfiles, records, following] = await Promise.all([
      LB.loadProfiles(),
      LB.loadRecords(),
      profile ? window.StudillaSocial.followingIds() : Promise.resolve([]),
    ]);
    profiles = loadedProfiles;
    friendIds = following;
    boards = LB.buildBoards(profiles, records);
    renderAll();
  }

  init();

  window.supabaseClient.auth.onAuthStateChange(async () => {
    profile = await Auth.getCurrentProfile();
    friendIds = profile ? await window.StudillaSocial.followingIds() : [];
    renderAll();
  });
})();
</script>
</body>
</html>
