<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studilla · Kontakt</title>
<meta name="description" content="Ta kontakt med Studilla på TikTok, e-post eller gjennom kontaktskjemaet.">
<meta property="og:title" content="Studilla · Kontakt">
<meta property="og:description" content="Ta kontakt med Studilla på TikTok, e-post eller gjennom kontaktskjemaet.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Studilla">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="mask-icon" href="assets/img/favicon.svg" color="#2ee87f">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="kontakt">
<div class="page">

  <div id="site-header"></div>

  <main>
    <section style="display:flex;justify-content:center">
      <div class="auth-card">
        <div>
          <h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--text-strong)">Kontakt</h1>
          <p class="section-sub" style="margin:6px 0 0">Ta kontakt på TikTok, e-post eller gjennom skjemaet under.</p>
        </div>

        <div class="contact-channels">
          <a href="mailto:hei@studilla.no" class="contact-channel-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"></rect><path d="M2 7l9.2 6.2a1.6 1.6 0 0 0 1.8 0L22 7"></path></svg>
            hei@studilla.no
          </a>
          <a href="https://www.tiktok.com/@studilla" target="_blank" rel="noopener" class="contact-channel-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.9-.78-1.44-1.9-1.51-3.14h-3.03v13.44c0 1.55-1.26 2.8-2.8 2.8a2.8 2.8 0 0 1 0-5.6c.28 0 .55.04.8.12V10.4a5.87 5.87 0 0 0-.8-.06 5.86 5.86 0 1 0 5.86 5.86V9.4a8.83 8.83 0 0 0 4.72 1.36V7.73c-1.13 0-2.18-.36-3.04-1a5.9 5.9 0 0 1-.2-.9z"></path></svg>
            studilla
          </a>
        </div>

        <div class="auth-divider"><span>eller send en melding</span></div>

        <form data-contact-form>
          <label class="auth-field">
            <span>Navn</span>
            <input type="text" name="name" required>
          </label>
          <label class="auth-field">
            <span>E-post</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label class="auth-field">
            <span>Melding</span>
            <textarea name="message" required rows="5"></textarea>
          </label>
          <button type="submit" class="btn-primary" style="width:100%">Send melding</button>
        </form>

        <p class="auth-fineprint">Send melding åpner e-postprogrammet ditt med meldingen ferdig utfylt til hei@studilla.no.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</div>

<script src="js/consent.js"></script>
<script src="js/cookie-banner.js"></script>
<script src="js/feature-flags.js"></script>
<script src="js/layout.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/avatar-figures.js"></script>
<script src="js/auth.js"></script>
<script src="js/visit-tracking.js"></script>
<script>
(function () {
  "use strict";
  var CONTACT_EMAIL = "hei@studilla.no";
  var form = document.querySelector("[data-contact-form]");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = form.elements.name.value.trim();
    var email = form.elements.email.value.trim();
    var message = form.elements.message.value.trim();

    var bodyLines = [
      name ? "Fra: " + name : "",
      email ? "E-post: " + email : "",
      "",
      message,
    ].filter(Boolean);

    var subject = encodeURIComponent("Melding fra Studilla-kontaktsiden");
    var body = encodeURIComponent(bodyLines.join("\n"));
    window.location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + subject + "&body=" + body;
  });
})();
</script>
</body>
</html>
